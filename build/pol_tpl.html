<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>@@TITLE@@ | Sams Office</title>
<style>
:root{--bg:#fff;--fg:#111827;--mut:#4B5563;--line:#D1D5DB;--acc:#1D4ED8}
@media (prefers-color-scheme:dark){:root{--bg:#111827;--fg:#F3F4F6;--mut:#D1D5DB;--line:#374151;--acc:#93C5FD}}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-left,0px)) 56px}
h1{font-size:28px;line-height:1.2;margin:18px 0 6px}h2{font-size:20px;margin:26px 0 6px}p{margin:8px 0}
.upd{color:var(--mut);font-size:15px}
nav{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding-bottom:12px;border-bottom:1px solid var(--line)}
a{color:var(--acc)}button{font:inherit;min-height:44px;padding:0 16px;border:2px solid var(--acc);background:transparent;color:var(--acc);border-radius:8px;cursor:pointer}
button[aria-pressed="true"]{background:var(--acc);color:var(--bg)}
a:focus-visible,button:focus-visible{outline:3px solid #F59E0B;outline-offset:2px}
[hidden]{display:none!important}
</style></head><body><main>
<nav><a href="./">Sams Office</a><span><button id="bEn" aria-pressed="true" type="button">English</button> <button id="bEs" aria-pressed="false" type="button">Espa&ntilde;ol</button></span></nav>
@@EN@@@@ES@@
<p style="margin-top:32px"><a href="@@OFILE@@" id="oth" data-en="@@OEN@@" data-es="@@OES@@">@@OEN@@</a></p>
</main>
<script>
(function () {
  var en = document.querySelector('[data-l=en]'), es = document.querySelector('[data-l=es]'), be = document.getElementById('bEn'), bs = document.getElementById('bEs'), o = document.getElementById('oth');
  var T = { en: '@@TEN@@', es: '@@TES@@' };
  function setL(l) {
    en.hidden = l !== 'en'; es.hidden = l !== 'es';
    be.setAttribute('aria-pressed', l === 'en' ? 'true' : 'false'); bs.setAttribute('aria-pressed', l === 'es' ? 'true' : 'false');
    document.documentElement.lang = l; document.title = T[l] + ' | Sams Office';
    o.textContent = o.getAttribute('data-' + l);
    try { localStorage.setItem('sams-lang', l); } catch (e) { }
  }
  be.addEventListener('click', function () { setL('en'); }); bs.addEventListener('click', function () { setL('es'); });
  var l = ''; try { l = localStorage.getItem('sams-lang') || ''; } catch (e) { }
  if (l !== 'en' && l !== 'es') { l = (navigator.language || '').toLowerCase().indexOf('es') === 0 ? 'es' : 'en'; }
  var m = /[?&]lang=(en|es)/.exec(location.search); if (m) l = m[1];
  setL(l);
})();
</script></body></html>
